<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Chess Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <span class="chess-icon">♛</span> SwissManager
            </div>
            <div class="controls">
                <button id="btn-new" class="btn-secondary">🆕 Nuevo Torneo</button>
                <button id="btn-save" class="btn-secondary">💾 Guardar Torneo</button>
                <button id="btn-load" class="btn-secondary">📂 Cargar Torneo</button>
                <input type="file" id="file-input" style="display: none" accept=".json">
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="players">Jugadores</button>
            <button class="tab-btn" data-tab="pairings">Emparejamientos</button>
            <button class="tab-btn" data-tab="standings">Clasificación</button>
        </nav>

        <main>
            <!-- PLAYERS SECTION -->
            <section id="players" class="tab-content active">
                <div class="panel">
                    <h2>Registro de Jugadores</h2>
                    <div class="input-group">
                        <input type="text" id="player-name" placeholder="Nombre del Jugador">
                        <input type="number" id="player-elo" placeholder="ELO (Opcional)" value="1200">
                        <button id="btn-add-player" class="btn-primary">Añadir Jugador</button>
                    </div>
                </div>

                <div class="player-list-container">
                    <h3>Lista de Inscritos (<span id="player-count">0</span>)</h3>
                    <ul id="player-list">
                        <!-- Players will be added here -->
                    </ul>
                </div>
            </section>

            <!-- PAIRINGS SECTION -->
            <section id="pairings" class="tab-content">
                <div class="panel action-panel">
                    <div class="round-info">
                        <h2>Ronda <span id="current-round-num">0</span></h2>
                        <span id="tournament-status" class="badge">No Iniciado</span>
                    </div>
                    <div>
                        <button id="btn-start" class="btn-primary">▶ Iniciar Torneo</button>
                        <button id="btn-next-round" class="btn-primary" style="display:none;">Siguiente Ronda ⏩</button>
                    </div>
                </div>

                <!-- Mensaje de inicio -->
                <div id="start-message" class="start-message"></div>

                <div id="pairings-list" class="pairings-grid">
                    <div class="empty-state">El torneo no ha comenzado. Añade jugadores y pulsa Iniciar.</div>
                </div>
            </section>

            <!-- STANDINGS SECTION -->
            <section id="standings" class="tab-content">
                <h2>Tabla de Posiciones</h2>
                <div class="table-responsive">
                    <table class="standings-table">
                        <thead id="standings-head">
                            <tr>
                                <th>#</th>
                                <th>ID</th>
                                <th>Nombre</th>
                                <!-- columnas dinámicas de rondas -->
                                <th>Total</th>
                                <th>Buchholz</th>
                                <th>S.B.</th>
                            </tr>
                        </thead>
                        <tbody id="standings-body">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Logic -->
    <script src="swiss-logic.js"></script>
    <script src="app.js"></script>
</body>

</html>
